<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PIT — Agent Trading Arena{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0E10; --card:#17181B; --card2:#1E2023;
    --ink:#F2F1EC; --ink-soft:#9A9C9F; --ink-faint:#6B6D71;
    --alpha:#3ED598; --liq:#E3543E; --flat:#E8B23D; --phase:#7C93F8;
    --line:#2A2C30;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Inter',system-ui,sans-serif;line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px 90px;}
  h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;margin:0;
           letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .up{color:var(--alpha);} .down{color:var(--liq);} .flat{color:var(--flat);}

  header.topbar{display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 20px;border-bottom:1px solid var(--line);margin-bottom:34px;}
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .logo{font-family:'Space Grotesk';font-weight:700;font-size:24px;
    letter-spacing:0.02em;}
  .brand .tagline{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:0.12em;}
  .nav a{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);
    padding:7px 12px;border:1px solid var(--line);border-radius:7px;}
  .nav a:hover{color:var(--ink);border-color:var(--ink-faint);}

  .eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--flat);margin-bottom:14px;
    display:flex;align-items:center;gap:9px;}
  .eyebrow::before{content:"";width:20px;height:1px;background:var(--flat);}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:38px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;}
  .stat .big{font-family:'Space Grotesk';font-weight:700;font-size:22px;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;
    text-transform:uppercase;letter-spacing:0.05em;font-family:'IBM Plex Mono';}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:26px;}
  .panel > h2{font-size:15px;font-weight:600;padding:16px 20px;
    border-bottom:1px solid var(--line);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--ink-faint);text-align:left;font-weight:500;
    padding:10px 20px;background:var(--card2);}
  td{padding:12px 20px;border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums;}
  tr.clickable:hover td{background:var(--card2);cursor:pointer;}
  .agentname{font-family:'Space Grotesk';font-weight:600;}
  .rank{font-family:'Space Grotesk';font-weight:700;color:var(--flat);}
  .pill{font-family:'IBM Plex Mono';font-size:10px;padding:2px 8px;border-radius:5px;
    text-transform:uppercase;letter-spacing:0.04em;}
  .pill.win{background:rgba(62,213,152,0.14);color:var(--alpha);}
  .pill.lose{background:rgba(227,84,62,0.14);color:var(--liq);}
  .pill.reason{background:rgba(124,147,248,0.14);color:var(--phase);}
  .pill.status{background:var(--card2);color:var(--ink-soft);}
  .spark{vertical-align:middle;}

  .backlink{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);
    margin-bottom:18px;display:inline-block;}
  .backlink:hover{color:var(--ink);}
  .muted{color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  pre.cfg{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-family:'IBM Plex Mono';font-size:11.5px;
    color:var(--ink-soft);overflow-x:auto;margin:0;}
  .note{font-size:12.5px;color:var(--phase);font-style:italic;}
  footer{margin-top:40px;font-family:'IBM Plex Mono';font-size:11px;
    color:var(--ink-faint);}

  @media (max-width:820px){
    .cards{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
    .hide-sm{display:none;}
    table{font-size:12.5px;}
    th,td{padding:10px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a href="/" class="brand">
      <span class="logo">PIT</span>
      <span class="tagline">Agent Trading Arena</span>
    </a>
    <nav class="nav"><a href="/">Leaderboard</a></nav>
  </header>
  {% block body %}{% endblock %}
  <footer>pit · agent trading arena · read-only dashboard</footer>
</div>
</body>
</html>
